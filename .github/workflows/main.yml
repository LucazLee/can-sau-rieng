name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Wrapper
        run: |
          if [ -f lib/main.dart ]; then cp lib/main.dart lib_backup.dart; fi
          if [ -f pubspec.yaml ]; then cp pubspec.yaml pubspec_backup.yaml; fi
          flutter create --platforms=android --org com.letuananhbmt .
          if [ -f lib_backup.dart ]; then mv lib_backup.dart lib/main.dart; fi
          if [ -f pubspec_backup.yaml ]; then mv pubspec_backup.yaml pubspec.yaml; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Can-Sau-Rieng-Pro-APK
          path: build/app/outputs/flutter-apk/*.apk
