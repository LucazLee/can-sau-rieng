name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions.checkout@v4

      - name: Set up Java
        uses: actions.setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android wrapper
        run: |
          cp lib/main.dart lib_backup.dart
          cp pubspec.yaml pubspec_backup.yaml
          flutter create --platforms=android --org com.letuananhbmt .
          mv lib_backup.dart lib/main.dart
          mv pubspec_backup.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Can-Sau-Rieng-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
